<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740"
     role="img" aria-labelledby="kaimode-roles-title kaimode-roles-desc"
     font-family="Segoe UI, PingFang SC, sans-serif">
  <title id="kaimode-roles-title">角色层与技能地图（8 份角色正本 · 6 插件 20 技能）</title>
  <desc id="kaimode-roles-desc">左侧为酒馆冒险团角色层：主 AI 人格、角色模板 canon、皮肤 skins、同一个组装点、角色实例与宿主派生物；右侧为六插件十九技能清单与武器集认领关系。</desc>
  <defs>
    <marker id="kmro-ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
  </defs>

  <text x="44" y="46" font-size="23" font-weight="bold" fill="#0f172a">角色层与技能地图（v0.39.0 · 8 份角色正本 · 6 插件 20 技能）</text>
  <text x="44" y="72" font-size="13" fill="#64748b">角色是子代理，不是常驻会话；派活规则唯一家是 engine/skills/fleet/SKILL.md</text>

  <text x="44" y="118" font-size="15" font-weight="bold" fill="#312e81">角色层（酒馆冒险团）</text>

  <rect x="44" y="136" width="556" height="62" rx="10" fill="#eef2ff" stroke="#4f46e5" stroke-width="2"/>
  <text x="322" y="160" font-size="14" font-weight="bold" text-anchor="middle" fill="#312e81">主 AI 人格 · 康娜（coordinator · kind: primary）</text>
  <text x="322" y="180" font-size="11" text-anchor="middle" fill="#3730a3">唯一对话面；会话级人格，不是候选项，也不进可派发包</text>
  <line x1="322" y1="198" x2="322" y2="220" stroke="#475569" stroke-width="1.4" marker-end="url(#kmro-ar)"/>

  <rect x="44" y="224" width="270" height="86" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="179" y="248" font-size="13" font-weight="bold" text-anchor="middle" fill="#5b21b6">角色模板 canon ×8</text>
  <text x="179" y="268" font-size="10.5" text-anchor="middle" fill="#6d28d9">mission / boundaries</text>
  <text x="179" y="284" font-size="10.5" text-anchor="middle" fill="#6d28d9">workflow / output_contract</text>
  <text x="179" y="300" font-size="10" text-anchor="middle" fill="#64748b">宿主中立正本（roles/canon/）</text>

  <rect x="330" y="224" width="270" height="86" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="465" y="248" font-size="13" font-weight="bold" text-anchor="middle" fill="#5b21b6">皮肤 skins ×2</text>
  <text x="465" y="268" font-size="10.5" text-anchor="middle" fill="#6d28d9">generic（通用职业名）</text>
  <text x="465" y="284" font-size="10.5" text-anchor="middle" fill="#6d28d9">guild（酒馆冒险团具名）</text>
  <text x="465" y="300" font-size="10" text-anchor="middle" fill="#64748b">name / identity / personality</text>

  <line x1="179" y1="310" x2="179" y2="332" stroke="#475569" stroke-width="1.3" marker-end="url(#kmro-ar)"/>
  <line x1="465" y1="310" x2="465" y2="332" stroke="#475569" stroke-width="1.3" marker-end="url(#kmro-ar)"/>

  <rect x="44" y="336" width="556" height="52" rx="8" fill="#fafafa" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="322" y="357" font-size="12.5" font-weight="bold" text-anchor="middle" fill="#334155">同一个组装点（scripts/render-roles.py）</text>
  <text x="322" y="375" font-size="10.5" text-anchor="middle" fill="#64748b">皮肤两块 + 正本四块逐字 + 一行指纹（canon/skin 版本与 hash）</text>
  <line x1="322" y1="388" x2="322" y2="410" stroke="#475569" stroke-width="1.4" marker-end="url(#kmro-ar)"/>

  <rect x="44" y="414" width="270" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="179" y="438" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">角色实例 ×7（可派发）</text>
  <text x="179" y="458" font-size="10.5" text-anchor="middle" fill="#1d4ed8">一次派发＝一个新上下文子代理</text>
  <text x="179" y="474" font-size="10.5" text-anchor="middle" fill="#1d4ed8">任务结束即散，不互相唤醒</text>
  <text x="179" y="494" font-size="10" text-anchor="middle" fill="#64748b">researcher · architect · engineer</text>
  <text x="179" y="508" font-size="10" text-anchor="middle" fill="#64748b">designer · writer · archivist · reviewer</text>

  <rect x="330" y="414" width="270" height="96" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
  <text x="465" y="438" font-size="13" font-weight="bold" text-anchor="middle" fill="#1e3a8a">宿主派生物（只是缓存）</text>
  <text x="465" y="458" font-size="10.5" text-anchor="middle" fill="#1d4ed8">定义文件或提示词文件</text>
  <text x="465" y="474" font-size="10.5" text-anchor="middle" fill="#1d4ed8">装／升级一律重渲染覆盖</text>
  <text x="465" y="494" font-size="10" text-anchor="middle" fill="#64748b">不做「哪份过期」巡检</text>
  <text x="465" y="508" font-size="10" text-anchor="middle" fill="#64748b">覆盖前备份到 .backups/</text>

  <line x1="322" y1="510" x2="322" y2="532" stroke="#475569" stroke-width="1.3" marker-end="url(#kmro-ar)"/>

  <rect x="44" y="536" width="556" height="76" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
  <text x="322" y="560" font-size="13" font-weight="bold" text-anchor="middle" fill="#065f46">宿主投影（adapters/role-hosts.json）</text>
  <text x="322" y="580" font-size="10.5" text-anchor="middle" fill="#047857">定义文件层：Claude Code · Qoder · Copilot · Cursor</text>
  <text x="322" y="598" font-size="10.5" text-anchor="middle" fill="#047857">提示词层：Codex · OpenCode（无 agent 定义文件）</text>

  <g font-family="Georgia, serif" font-style="italic" fill="#334155">
    <text x="44" y="642" font-size="12">只读不靠宿主工具白名单，靠三件宿主无关的门：</text>
    <text x="44" y="662" font-size="12">工作树隔离 / 范围校验 / 发货单点；做不到要如实登记 soft-permission-only。</text>
    <text x="44" y="688" font-size="12">记忆：只有 archivist 能写经验日志，其他角色只能提候选。</text>
  </g>

  <!-- 右侧技能地图 -->
  <text x="640" y="118" font-size="15" font-weight="bold" fill="#1e3a8a">技能地图（6 插件 / 20 技能）</text>

  <g font-size="11">
    <rect x="640" y="136" width="600" height="64" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
    <text x="656" y="158" font-size="13" font-weight="bold" fill="#312e81">core 酒馆冒险团与安装 · 7</text>
    <text x="656" y="180" fill="#3730a3">gold · staff · set-kai-mode · upgrade-kai-mode · kai-handoff · harness-audit · principles</text>

    <rect x="640" y="208" width="600" height="64" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.4"/>
    <text x="656" y="230" font-size="13" font-weight="bold" fill="#065f46">engine 执行内核 · 2</text>
    <text x="656" y="252" fill="#047857">fleet（控制面：run/warp/jump/resume/status）· pk（对比分析）</text>

    <rect x="640" y="280" width="600" height="64" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="656" y="302" font-size="13" font-weight="bold" fill="#1e3a8a">intake 想法池 · 1</text>
    <text x="656" y="324" fill="#1d4ed8">kai-boom-idea-log（全文落盘，汇总票只贴简述）</text>

    <rect x="640" y="352" width="600" height="64" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="656" y="374" font-size="13" font-weight="bold" fill="#92400e">ops 事故与运维 · 2</text>
    <text x="656" y="396" fill="#92400e">incident-response（分级止损/时间线/复盘）· runbook（可照跑步骤）</text>

    <rect x="640" y="424" width="600" height="64" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
    <text x="656" y="446" font-size="13" font-weight="bold" fill="#5b21b6">studio 武器集 · 6</text>
    <text x="656" y="468" fill="#6d28d9">producer · lead-writer · lead-artist · director · final-review · marketing</text>

    <rect x="640" y="496" width="600" height="64" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
    <text x="656" y="518" font-size="13" font-weight="bold" fill="#334155">board 看板 · 1</text>
    <text x="656" y="540" fill="#64748b">flight-info（SQLite 落库 → board.json ＋ index.html）</text>
  </g>

  <rect x="640" y="584" width="600" height="80" rx="8" fill="#f5f3ff" stroke="#6d28d9" stroke-width="1.4"/>
  <text x="656" y="608" font-size="13" font-weight="bold" fill="#5b21b6">武器集认领（weapon_of）</text>
  <text x="656" y="630" font-size="11" fill="#6d28d9">producer → 康娜 · lead-writer / marketing → writer</text>
  <text x="656" y="650" font-size="11" fill="#6d28d9">lead-artist / director → designer · final-review → reviewer</text>

  <text x="640" y="700" font-size="10.5" fill="#64748b">清单唯一事实源：.claude-plugin/marketplace.json</text>
  <text x="640" y="716" font-size="10.5" fill="#64748b">安装档位 core（7）/ full（19）住 manifests/install-profiles.json</text>
</svg>
