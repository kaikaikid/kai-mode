<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640"
     role="img" aria-labelledby="kaimode-state-title kaimode-state-desc"
     font-family="Segoe UI, PingFang SC, sans-serif">
  <title id="kaimode-state-title">fleet 执行内核状态机（run 级与 task 级）</title>
  <desc id="kaimode-state-desc">run 主链 queued→planning→design→delegating→reviewing→closing→done，三扇门 G0/G1/G2 串行，blocked/cancelled/failed 为恢复或终态；下方为每个任务的子状态链。</desc>
  <defs>
    <marker id="kms-ar" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#475569"/>
    </marker>
    <marker id="kms-ard" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <text x="44" y="44" font-size="23" font-weight="bold" fill="#0f172a">fleet 执行内核状态机（v0.39.0 · run 级 10 态 / task 级 8 态）</text>
  <text x="44" y="70" font-size="13" fill="#64748b">状态推进全走 fleet 命令，AI 绝不手改 state.json；验收读实际 diff</text>

  <!-- run 主链 -->
  <g font-size="13">
    <rect x="44" y="108" width="124" height="74" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
    <text x="106" y="140" font-weight="bold" text-anchor="middle" fill="#92400e">queued</text>
    <text x="106" y="158" font-size="10.5" text-anchor="middle" fill="#92400e">等槽位</text>

    <rect x="198" y="108" width="124" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
    <text x="260" y="140" font-weight="bold" text-anchor="middle" fill="#312e81">planning</text>
    <text x="260" y="158" font-size="10.5" text-anchor="middle" fill="#3730a3">拆任务图·等 G0</text>

    <rect x="352" y="108" width="124" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
    <text x="414" y="140" font-weight="bold" text-anchor="middle" fill="#312e81">design</text>
    <text x="414" y="158" font-size="10.5" text-anchor="middle" fill="#3730a3">设计规格·等 G1</text>

    <rect x="506" y="108" width="124" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="568" y="140" font-weight="bold" text-anchor="middle" fill="#1e3a8a">delegating</text>
    <text x="568" y="158" font-size="10.5" text-anchor="middle" fill="#1d4ed8">claim/report 循环</text>

    <rect x="660" y="108" width="124" height="74" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.4"/>
    <text x="722" y="140" font-weight="bold" text-anchor="middle" fill="#1e3a8a">reviewing</text>
    <text x="722" y="158" font-size="10.5" text-anchor="middle" fill="#1d4ed8">逐任务验收</text>

    <rect x="814" y="108" width="124" height="74" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.4"/>
    <text x="876" y="140" font-weight="bold" text-anchor="middle" fill="#312e81">closing</text>
    <text x="876" y="158" font-size="10.5" text-anchor="middle" fill="#3730a3">汇总·等 G2 发货</text>

    <rect x="968" y="108" width="124" height="74" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.8"/>
    <text x="1030" y="140" font-weight="bold" text-anchor="middle" fill="#065f46">done</text>
    <text x="1030" y="158" font-size="10.5" text-anchor="middle" fill="#047857">已发货关票</text>
  </g>

  <!-- run 主链箭头 -->
  <g stroke="#475569" stroke-width="1.4" fill="none">
    <line x1="168" y1="145" x2="196" y2="145" marker-end="url(#kms-ar)"/>
    <line x1="322" y1="145" x2="350" y2="145" marker-end="url(#kms-ar)"/>
    <line x1="476" y1="145" x2="504" y2="145" marker-end="url(#kms-ar)"/>
    <line x1="630" y1="145" x2="658" y2="145" marker-end="url(#kms-ar)"/>
    <line x1="784" y1="145" x2="812" y2="145" marker-end="url(#kms-ar)"/>
    <line x1="938" y1="145" x2="966" y2="145" marker-end="url(#kms-ar)"/>
  </g>

  <!-- 门 -->
  <g font-size="10.5" font-weight="bold">
    <rect x="330" y="92" width="14" height="12" rx="2" fill="#fff7ed" stroke="#b45309"/>
    <text x="337" y="101.5" text-anchor="middle" fill="#92400e">G0</text>
    <rect x="484" y="92" width="14" height="12" rx="2" fill="#fff7ed" stroke="#b45309"/>
    <text x="491" y="101.5" text-anchor="middle" fill="#92400e">G1</text>
    <rect x="894" y="92" width="14" height="12" rx="2" fill="#fff7ed" stroke="#b45309"/>
    <text x="901" y="101.5" text-anchor="middle" fill="#92400e">G2</text>
  </g>

  <!-- 说明 -->
  <g font-size="11" fill="#64748b">
    <text x="44" y="204">queued：并发槽满排队，槽位空出由 promote_queued 先到先得自动提升（不占资源不烧 token）</text>
    <text x="44" y="222">无 UI：G0 通过后 planning → delegating 直接，跳过 design / G1；有 UI 才进 design</text>
  </g>

  <!-- 恢复/终态 -->
  <rect x="180" y="248" width="180" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.2"/>
  <text x="270" y="274" font-size="13" font-weight="bold" text-anchor="middle" fill="#334155">cancelled</text>
  <text x="270" y="292" font-size="10.5" text-anchor="middle" fill="#64748b">fleet stop · 终态</text>

  <rect x="430" y="248" width="180" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.6"/>
  <text x="520" y="274" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">blocked</text>
  <text x="520" y="292" font-size="10.5" text-anchor="middle" fill="#b91c1c">需人决策 · 非终点</text>

  <rect x="860" y="248" width="180" height="60" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.4"/>
  <text x="950" y="274" font-size="13" font-weight="bold" text-anchor="middle" fill="#991b1b">failed</text>
  <text x="950" y="292" font-size="10.5" text-anchor="middle" fill="#b91c1c">不可恢复 · 终态</text>

  <g stroke="#94a3b8" stroke-width="1.2" fill="none">
    <line x1="260" y1="182" x2="260" y2="246" marker-end="url(#kms-ard)"/>
    <line x1="568" y1="182" x2="568" y2="246" marker-end="url(#kms-ard)"/>
    <line x1="876" y1="182" x2="876" y2="246" marker-end="url(#kms-ard)"/>
  </g>
  <g font-size="10.5" fill="#64748b">
    <text x="272" y="226">fleet stop</text>
    <text x="580" y="226">任务 blocked/failed 且全部终态</text>
    <text x="888" y="226">ship 失败（jump 发货失败）</text>
  </g>
  <text x="44" y="336" font-size="11" fill="#64748b">任一阶段 → blocked（任务卡死 / ship 失败）；blocked 救场：仍有活 → delegating，期间全 accepted → reviewing</text>
  <text x="44" y="354" font-size="11" fill="#64748b">failed 声明于 TERMINAL_PHASES 但当前无命令写它（设计遗留）；cancelled 保留 state 供复盘</text>

  <!-- task 子状态 -->
  <text x="44" y="394" font-size="14" font-weight="bold" fill="#334155">task 状态（每个任务）</text>
  <g font-size="12">
    <rect x="60" y="410" width="130" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="125" y="436" font-weight="bold" text-anchor="middle" fill="#1e3a8a">pending</text>
    <text x="125" y="453" font-size="10" text-anchor="middle" fill="#1d4ed8">plan 写入 / release</text>

    <rect x="230" y="410" width="130" height="58" rx="8" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.3"/>
    <text x="295" y="436" font-weight="bold" text-anchor="middle" fill="#1e3a8a">running</text>
    <text x="295" y="453" font-size="10" text-anchor="middle" fill="#1d4ed8">claim 原子占位</text>

    <rect x="400" y="410" width="130" height="58" rx="8" fill="#eef2ff" stroke="#4f46e5" stroke-width="1.3"/>
    <text x="465" y="436" font-weight="bold" text-anchor="middle" fill="#312e81">review</text>
    <text x="465" y="453" font-size="10" text-anchor="middle" fill="#3730a3">report 已收，等裁决</text>

    <rect x="570" y="410" width="130" height="58" rx="8" fill="#ecfdf5" stroke="#047857" stroke-width="1.5"/>
    <text x="635" y="436" font-weight="bold" text-anchor="middle" fill="#065f46">accepted</text>
    <text x="635" y="453" font-size="10" text-anchor="middle" fill="#047857">终态（deps 放行）</text>

    <rect x="400" y="494" width="130" height="58" rx="8" fill="#fef3c7" stroke="#b45309" stroke-width="1.3"/>
    <text x="465" y="520" font-weight="bold" text-anchor="middle" fill="#92400e">returned</text>
    <text x="465" y="537" font-size="10" text-anchor="middle" fill="#92400e">attempts+1</text>

    <rect x="570" y="494" width="130" height="58" rx="8" fill="#fef2f2" stroke="#b91c1c" stroke-width="1.3"/>
    <text x="635" y="520" font-weight="bold" text-anchor="middle" fill="#991b1b">blocked</text>
    <text x="635" y="537" font-size="10" text-anchor="middle" fill="#b91c1c">attempts≥3 / 连败 2</text>
  </g>
  <g stroke="#475569" stroke-width="1.3" fill="none">
    <line x1="190" y1="439" x2="228" y2="439" marker-end="url(#kms-ar)"/>
    <line x1="360" y1="439" x2="398" y2="439" marker-end="url(#kms-ar)"/>
    <line x1="530" y1="439" x2="568" y2="439" marker-end="url(#kms-ar)"/>
    <line x1="465" y1="468" x2="465" y2="492" marker-end="url(#kms-ar)"/>
    <line x1="530" y1="523" x2="568" y2="523" marker-end="url(#kms-ar)"/>
  </g>
  <g font-size="10" fill="#475569">
    <text x="198" y="432">claim</text>
    <text x="368" y="432">report</text>
    <text x="540" y="432">accept</text>
    <text x="474" y="484">return</text>
    <text x="540" y="516">retry</text>
  </g>
  <text x="44" y="580" font-size="11" fill="#64748b">returned 且 attempts&lt;3 可重新 claim（→ running）；returned 且 attempts≥3 → task.blocked；abandoned 视为不再阻塞 deps 的终态（无命令写）</text>
</svg>
