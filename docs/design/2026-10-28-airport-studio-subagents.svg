<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1200" viewBox="0 0 1680 1200" font-family="Segoe UI, Microsoft YaHei, PingFang SC, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#10b981"/>
    </marker>
  </defs>

  <rect width="1680" height="1200" fill="#fbfaf7"/>

  <text x="60" y="54" font-size="27" font-weight="700" fill="#1f2937">kai-mode 全景：机场体系 ＋ 艺术工坊体系 ＋ 子代理与模型组</text>
  <text x="60" y="82" font-size="13.5" fill="#6b7280">岗位＝组长（长期会话）　·　工种＝模式（lead/make）　·　子代理＝外包（一次性，按产出物形态挑，深度 1 层）</text>

  <!-- 人工 -->
  <rect x="60" y="102" width="1560" height="52" rx="10" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="80" y="124" font-size="14.5" font-weight="700" fill="#92400e">人工</text>
  <text x="80" y="143" font-size="12.5" fill="#92400e">只在这几处出现：红线 · 肉眼可见的取舍（观感/文案/布局）· 阶段门拍板 · 卡点 · 唤醒角色</text>

  <!-- 左：机场 -->
  <text x="60" y="190" font-size="17" font-weight="700" fill="#1d4ed8">① 机场体系 · 工程</text>
  <text x="60" y="209" font-size="12" fill="#64748b">票制 · 车道 · 塔台独占 push 与关票</text>

  <rect x="60" y="222" width="340" height="96" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="76" y="246" font-size="14" font-weight="700" fill="#1d4ed8">地勤　/ground-crew</text>
  <text x="76" y="268" font-size="12" fill="#334155">对话、规划、开票（AC／边界／验证命令）</text>
  <text x="76" y="288" font-size="12" fill="#334155">开票后三选一：王牌队列／等塔台</text>
  <text x="76" y="307" font-size="11.5" fill="#64748b">不写码、不派施工</text>

  <rect x="440" y="222" width="340" height="96" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="456" y="246" font-size="14" font-weight="700" fill="#1d4ed8">塔台　/tower</text>
  <text x="456" y="268" font-size="12" fill="#334155">60 分钟定时唤醒 → 抢令牌 → 发货 → 排班</text>
  <text x="456" y="288" font-size="12" fill="#334155">排班算法住 references/scheduling.md</text>
  <text x="456" y="307" font-size="11.5" fill="#64748b">独占 push／合并／关票</text>

  <rect x="60" y="338" width="340" height="112" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="76" y="362" font-size="14" font-weight="700" fill="#1d4ed8">机长 / 副机长 / 二副</text>
  <text x="76" y="384" font-size="12" fill="#334155">各读一张日表：-main / -deputy / -second</text>
  <text x="76" y="404" font-size="12" fill="#334155">每票 1 施工 + 1 审查，滚动消费到表空</text>
  <text x="76" y="424" font-size="12" fill="#334155">取舍默认派裁决，不问人</text>
  <text x="76" y="442" font-size="11.5" fill="#64748b">只管理不写码、不 push</text>

  <rect x="440" y="338" width="340" height="112" rx="9" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="456" y="362" font-size="14" font-weight="700" fill="#1d4ed8">王牌　/ace</text>
  <text x="456" y="384" font-size="12" fill="#334155">加急道：读 -ace.md，滚动消费</text>
  <text x="456" y="404" font-size="12" fill="#334155">免票热修须过热修 lint（分支/标识/日表行）</text>
  <text x="456" y="424" font-size="12" fill="#334155">执行帽口径见协议 §一</text>
  <text x="456" y="442" font-size="11.5" fill="#64748b">不 push、不合并、不关票</text>

  <rect x="60" y="496" width="720" height="54" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="76" y="518" font-size="12.5" font-weight="700" fill="#334155">记录面</text>
  <text x="140" y="518" font-size="12" fill="#475569">Issue 评论（唯一状态源）· 三张日表 · handoff/ 交接 · 待发货队列（ship-queue）</text>
  <text x="76" y="538" font-size="11.5" fill="#64748b">状态不写表、不写本地账本；机长不写、地勤不写，只有持牌塔台写</text>

  <!-- 右：创作 -->
  <text x="880" y="190" font-size="17" font-weight="700" fill="#6d28d9">② 创作体系 · 三坊两台</text>
  <text x="880" y="209" font-size="12" fill="#64748b">独立体系：不走机场的票与工作树；靠阶段门与接口卡</text>

  <rect x="880" y="222" width="340" height="96" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="896" y="246" font-size="14" font-weight="700" fill="#6d28d9">制片台　/producer</text>
  <text x="896" y="268" font-size="12" fill="#334155">立项、范围、排期、预算、跨坊协调</text>
  <text x="896" y="288" font-size="12" fill="#334155">签 G0 立项 / G5 交付</text>
  <text x="896" y="307" font-size="11.5" fill="#64748b">不替工坊做创作决定</text>

  <rect x="1260" y="222" width="360" height="96" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="1276" y="246" font-size="14" font-weight="700" fill="#6d28d9">审片台　/review</text>
  <text x="1276" y="268" font-size="12" fill="#334155">--visual / --text / --time / --cross</text>
  <text x="1276" y="288" font-size="12" fill="#334155">独立审查，逐条对 brief 与清单，出 verdict</text>
  <text x="1276" y="307" font-size="11.5" fill="#64748b">必须新上下文；只判不修</text>

  <rect x="880" y="338" width="740" height="150" rx="9" fill="#f5f3ff" stroke="#8b5cf6"/>
  <text x="896" y="360" font-size="13" font-weight="700" fill="#6d28d9">三坊（每坊一个组长，工种用模式区分）</text>
  <text x="1140" y="360" font-size="11.5" fill="#7c3aed">艺术工坊 ＝ 跨坊项目里被指定为主创的那一坊（不是第四坊）</text>

  <rect x="896" y="370" width="224" height="104" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="908" y="390" font-size="12.5" font-weight="700" fill="#5b21b6">视觉坊 /visual</text>
  <text x="908" y="410" font-size="11.5" fill="#334155">--lead 美术指导</text>
  <text x="908" y="428" font-size="11.5" fill="#334155">--make 插画·设计</text>
  <text x="908" y="448" font-size="11" fill="#64748b">风格板·角色·色彩·版面</text>
  <text x="908" y="465" font-size="11" fill="#64748b">不改故事结构</text>

  <rect x="1138" y="370" width="224" height="104" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1150" y="390" font-size="12.5" font-weight="700" fill="#5b21b6">文字坊 /text</text>
  <text x="1150" y="410" font-size="11.5" fill="#334155">--lead 主编</text>
  <text x="1150" y="428" font-size="11.5" fill="#334155">--make 编剧·文案</text>
  <text x="1150" y="448" font-size="11" fill="#64748b">骨架·脚本·台词·字幕</text>
  <text x="1150" y="465" font-size="11" fill="#64748b">不排版、不定色</text>

  <rect x="1380" y="370" width="224" height="104" rx="8" fill="#ffffff" stroke="#c4b5fd"/>
  <text x="1392" y="390" font-size="12.5" font-weight="700" fill="#5b21b6">时间坊 /time</text>
  <text x="1392" y="410" font-size="11.5" fill="#334155">--lead 导演</text>
  <text x="1392" y="428" font-size="11.5" fill="#334155">--make 动画·剪辑·声音</text>
  <text x="1392" y="448" font-size="11" fill="#64748b">分镜·节奏·成片</text>
  <text x="1392" y="465" font-size="11" fill="#64748b">不改文字定稿</text>

  <rect x="880" y="496" width="740" height="54" rx="8" fill="#faf5ff" stroke="#c4b5fd"/>
  <text x="896" y="518" font-size="12.5" font-weight="700" fill="#5b21b6">阶段门</text>
  <text x="956" y="518" font-size="11.5" fill="#4c1d95">G0 立项★ → G1 方向 → G2 风格/语感★ → G3 草案★ → G4 审查 → G5 交付★</text>
  <text x="896" y="538" font-size="11" fill="#64748b">★＝用户拍板；其余自决并写 decisions.md　｜　记录面：brief.md · decisions.md · delivery.md · review/ · 各坊 style-bible/voice-guide/board</text>

  <!-- 派活总线 -->
  <line x1="230" y1="450" x2="230" y2="590" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="610" y1="450" x2="610" y2="590" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="1250" y1="488" x2="1250" y2="590" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="230" y1="590" x2="1404" y2="590" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="700" y="583" font-size="12" fill="#475569">派活：按「产出物形态」挑，不判任务大小，不问用户</text>
  <line x1="262" y1="590" x2="262" y2="640" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="636" y1="590" x2="636" y2="640" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="1012" y1="590" x2="1012" y2="640" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>
  <line x1="1404" y1="590" x2="1404" y2="640" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- 子代理 -->
  <rect x="60" y="640" width="1560" height="186" rx="10" fill="#ecfdf5" stroke="#10b981"/>
  <text x="80" y="664" font-size="16" font-weight="700" fill="#047857">③ 子代理层 · 4 类（只按权限 + 交付物分，不按能力分）</text>
  <text x="700" y="664" font-size="11.5" fill="#047857">触发条件是「要不要写盘 / 要不要独立判断 / 要不要读大量资料」，与活大活小无关</text>

  <rect x="80" y="678" width="360" height="132" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="94" y="700" font-size="13" font-weight="700" fill="#047857">施工 · 可写</text>
  <text x="94" y="722" font-size="11.5" fill="#334155">触发：要改文件（有写权限就是施工）</text>
  <text x="94" y="742" font-size="11.5" fill="#334155">交付：代码 + 回执（commit/改动/AC 证据）</text>
  <text x="94" y="762" font-size="11.5" fill="#334155">约束：同一文件域只一个写手</text>
  <text x="94" y="788" font-size="12" font-weight="700" fill="#b45309">→ role-impl · high</text>

  <rect x="456" y="678" width="360" height="132" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="470" y="700" font-size="13" font-weight="700" fill="#047857">审查 · 只读 · 新上下文</text>
  <text x="470" y="722" font-size="11.5" fill="#334155">触发：施工完成 / 交付前（每票 1 次）</text>
  <text x="470" y="742" font-size="11.5" fill="#334155">交付：verdict=pass|fail + 逐条证据</text>
  <text x="470" y="762" font-size="11.5" fill="#334155">约束：施工者不得自审</text>
  <text x="470" y="788" font-size="12" font-weight="700" fill="#b45309">→ role-review · max</text>

  <rect x="832" y="678" width="360" height="132" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="846" y="700" font-size="13" font-weight="700" fill="#047857">裁决 · 只读 · 新上下文</text>
  <text x="846" y="722" font-size="11.5" fill="#334155">触发：两条路都能走、用户不在</text>
  <text x="846" y="742" font-size="11.5" fill="#334155">交付：ruling=a|b|defer + 四件</text>
  <text x="846" y="762" font-size="11.5" fill="#334155">约束：不裁红线、不裁观感</text>
  <text x="846" y="788" font-size="12" font-weight="700" fill="#b45309">→ role-review · max</text>

  <rect x="1208" y="678" width="392" height="132" rx="8" fill="#ffffff" stroke="#6ee7b7"/>
  <text x="1222" y="700" font-size="13" font-weight="700" fill="#047857">调查 / 量具 · 只读</text>
  <text x="1222" y="722" font-size="11.5" fill="#334155">触发：只读且量大（小活角色自己干，不派）</text>
  <text x="1222" y="742" font-size="11.5" fill="#334155">交付：结论 + 证据指针</text>
  <text x="1222" y="762" font-size="11.5" fill="#334155">约束：可并行；不写盘</text>
  <text x="1222" y="788" font-size="12" font-weight="700" fill="#b45309">→ role-research · low</text>

  <!-- 模型组 -->
  <rect x="60" y="846" width="1560" height="182" rx="10" fill="#fff7ed" stroke="#f97316"/>
  <text x="80" y="870" font-size="16" font-weight="700" fill="#c2410c">④ 模型组（挂在工种与子代理上，不挂在岗位上）</text>
  <text x="700" y="870" font-size="11.5" fill="#9a3412">子代理用 agent 文件的 model: 别名；会话用 magpie 档位映射（opus/sonnet/haiku → 组）</text>

  <rect x="80" y="884" width="290" height="126" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="94" y="906" font-size="13" font-weight="700" fill="#9a3412">role-impl · high</text>
  <text x="94" y="928" font-size="11.5" fill="#334155">服务：施工 / 时间坊 make</text>
  <text x="94" y="948" font-size="11.5" fill="#334155">链：GLM-5.3-Flash → deepseek-v4.1</text>
  <text x="94" y="968" font-size="11.5" fill="#334155">上下文：1M</text>
  <text x="94" y="992" font-size="11" fill="#64748b">剔除 free 与 MiniMax（跨度太大）</text>

  <rect x="386" y="884" width="290" height="126" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="400" y="906" font-size="13" font-weight="700" fill="#9a3412">role-review · max</text>
  <text x="400" y="928" font-size="11.5" fill="#334155">服务：审查 / 裁决 / 审片 / 各坊 lead</text>
  <text x="400" y="948" font-size="11.5" fill="#334155">链：kimi-k3 → zaicoding_glm-5.3</text>
  <text x="400" y="968" font-size="11.5" fill="#334155">上下文：1M</text>
  <text x="400" y="992" font-size="11" fill="#64748b">唯一支持 max 的强档，别省</text>

  <rect x="692" y="884" width="290" height="126" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="706" y="906" font-size="13" font-weight="700" fill="#9a3412">role-research · low</text>
  <text x="706" y="928" font-size="11.5" fill="#334155">服务：调查 / 量具 / 制片台</text>
  <text x="706" y="948" font-size="11.5" fill="#334155">链：GLM-5.3-Flash → beam-free</text>
  <text x="706" y="968" font-size="11.5" fill="#334155">上下文：1M（剔除 200k 成员）</text>
  <text x="706" y="992" font-size="11" fill="#64748b">量大、可降质；省钱省在这里</text>

  <rect x="998" y="884" width="290" height="126" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="1012" y="906" font-size="13" font-weight="700" fill="#9a3412">role-visual</text>
  <text x="1012" y="928" font-size="11.5" fill="#334155">服务：视觉坊 lead + make</text>
  <text x="1012" y="948" font-size="11.5" fill="#334155">链：gemini-3.8-flash → glm-4.6v</text>
  <text x="1012" y="968" font-size="11.5" fill="#334155">上下文：1M / 128k（视觉档较短）</text>
  <text x="1012" y="992" font-size="11" fill="#64748b">池内唯一带视觉的档</text>

  <rect x="1304" y="884" width="296" height="126" rx="8" fill="#ffffff" stroke="#fdba74"/>
  <text x="1318" y="906" font-size="13" font-weight="700" fill="#9a3412">role-text</text>
  <text x="1318" y="928" font-size="11.5" fill="#334155">服务：文字坊 lead + make</text>
  <text x="1318" y="948" font-size="11.5" fill="#334155">链：kimi-k3 → gemini-3.8-flash</text>
  <text x="1318" y="968" font-size="11.5" fill="#334155">上下文：1M（长稿需要）</text>
  <text x="1318" y="992" font-size="11" fill="#64748b">语感比速度重要</text>

  <!-- 硬约束 -->
  <rect x="60" y="1052" width="1560" height="120" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="80" y="1076" font-size="14" font-weight="700" fill="#334155">五条硬约束</text>
  <text x="80" y="1100" font-size="12" fill="#334155">① 子代理不派子代理（宿主默认允许 3 层，靠不给 Agent 工具锁死在 1 层）　② 子代理不继承主上下文，只拿派工卡五件（目标/范围/权限/验收/交付）</text>
  <text x="80" y="1122" font-size="12" fill="#334155">③ agent 文件只写 model / tools，不写判据（判据的家是 dispatch.md 与 loop-protocol.md）　④ 不开 CLAUDE_CODE_SUBAGENT_MODEL_FORCE 与全局 EFFORT（会压平分档）</text>
  <text x="80" y="1144" font-size="12" fill="#334155">⑤ 角色之间不互相唤醒（唤醒围栏）；跨会话只通过记录面交接——这是工单制，不是 agent team</text>
  <text x="80" y="1164" font-size="11.5" fill="#64748b">成本口径：单 agent ≈ 4× 对话 token，多 agent ≈ 15×；省钱靠「调查走便宜档 + 会话锁缓存」，不靠把活拆细</text>
</svg>
