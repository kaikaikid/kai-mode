name: plugin-check

# 体检：市场清单 ↔ 插件目录 ↔ 版本/摘要锁 ↔ 安装档位，再跑仓库 doctor。
# 与 KWP 的 CI 同形：本地清单是唯一来源，漂移即红；不接外部安全扫描与 MCP 存活检查。

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: plugin-check
        run: python scripts/plugin-check.py
      - name: doctor
        run: python scripts/doctor.py
