# Codex [agents] + MCP config template for this module.
# Derived from the live config on 2026-10-23 with every credential value and
# home path removed -- fill in <SET-YOUR-OWN> before use. Never commit a real
# token: the source file carried the GitHub MCP Authorization header.
#
# WARNING: max_depth and max_concurrent_threads_per_session below contradict
# kai-mode ADR-0141 (subagent headcount cap removed). Do not apply these two
# lines to any host until OPTIMIZATION-PLAN.md P0-bis is decided.

model_reasoning_effort = "max"
approval_policy = "never"
sandbox_mode = "danger-full-access"
model_provider = "magpie"
model_catalog_json = "magpie-models.json"
model = "group/agent"
openai_base_url = "http://127.0.0.1:3425/backend-api/codex"
notify = [ "<HOME>\\AppData\\Local\\OpenAI\\Codex\\runtimes\\cua_node\\b2c4f0c90eadfac4\\bin\\node_modules\\@oai\\sky\\bin\\windows\\codex-computer-use.exe", "turn-ended" ]
[agents]
max_concurrent_threads_per_session = 3
default_subagent_model = "group/tier-c"
default_subagent_reasoning_effort = "high"
max_depth = 1
job_max_runtime_seconds = 1800
[desktop]
followUpQueueMode = "steer"
enabled-reasoning-efforts = ["low", "medium", "high", "xhigh", "ultra", "persistent", "max", "none", "minimal"]
conversationDetailMode = "STEPS_COMMANDS"
sansFontSize = 14
